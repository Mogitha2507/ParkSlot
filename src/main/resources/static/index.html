
<!DOCTYPE html>
<html>
<head>
    <title>ParkSpot</title>
    <style>
        body{font-family:Arial;margin:30px;background:#f5f5f5}
        .box{background:white;padding:20px;margin:15px auto;max-width:700px}
        input,select,button{padding:10px;margin:5px;width:95%}
        button{background:#333;color:white;border:0}
        table{width:100%;border-collapse:collapse}
        td,th{border:1px solid #ccc;padding:8px}
        .free{color:green}.busy{color:red}
    </style>
</head>

<body>

<h1>🚗 ParkSpot</h1>

<div class="box">
    <h2>Dashboard</h2>
    <p>Total Records: <b id="total">0</b></p>
    <p>Currently Occupied: <b id="occupied">0</b></p>
    <p>Available Slots: <b id="available">0</b></p>
</div>

<div class="box">
    <h2>Vehicle Entry</h2>
    <input id="vehicle" placeholder="Vehicle Number">

    <select id="flat">
        <option value="1">A-101</option>
    </select>

    <select id="slot">
        <option value="1">S1</option>
    </select>

    <button onclick="entry()">Enter Vehicle</button>
    <p id="msg"></p>
</div>

<div class="box">
    <h2>Parking Slots</h2>
    <div id="slots"></div>
</div>

<div class="box">
    <h2>Vehicles</h2>
    <div id="vehicles"></div>
</div>

<div class="box">
    <h2>Daily Report</h2>
    <div id="report"></div>
</div>

<script>

function load(){
    fetch("/api/dashboard").then(r=>r.json()).then(d=>{
        total.innerText=d.totalVisitorRecords;
        occupied.innerText=d.currentlyOccupied;
    });

    fetch("/api/slots").then(r=>r.json()).then(d=>{
        available.innerText=d.filter(x=>!x.occupied).length;
        slots.innerHTML=d.map(x=>
            `<p>Slot ${x.slotNumber} :
            <b class="${x.occupied?'busy':'free'}">
            ${x.occupied?'Occupied':'Available'}</b></p>`
        ).join('');
    });

    fetch("/api/occupied").then(r=>r.json()).then(d=>{
        vehicles.innerHTML=d.length?
        `<table><tr><th>Vehicle</th><th>Slot</th><th>Exit</th></tr>
        ${d.map(x=>`
        <tr>
        <td>${x.vehicleNumber}</td>
        <td>${x.slot.slotNumber}</td>
        <td><button onclick="exit(${x.id})">Exit</button></td>
        </tr>`).join('')}
        </table>`:"No vehicles parked";
    });

    fetch("/api/daily-report").then(r=>r.json()).then(d=>{
        report.innerHTML=d.length?
        `<table><tr><th>Vehicle</th><th>Entry</th><th>Exit</th></tr>
        ${d.map(x=>`
        <tr>
        <td>${x.vehicleNumber}</td>
        <td>${x.entryTime}</td>
        <td>${x.exitTime||'Inside'}</td>
        </tr>`).join('')}</table>`:
        "No records";
    });
}

function entry(){
    fetch("/api/entries",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            vehicleNumber:vehicle.value,
            flatId:+flat.value,
            slotId:+slot.value
        })
    }).then(r=>{
        msg.innerText=r.ok?"Vehicle entered!":"Entry failed";
        load();
    });
}

function exit(id){
    fetch("/api/exits/"+id,{method:"PUT"})
    .then(()=>load());
}

load();

</script>
</body>
</html>
